<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>promo 1400x560</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1400px;
        height: 560px;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 48px;
        align-items: center;
        box-sizing: border-box;
        padding: 64px 80px;
        background-color: #23212b;
        background-image:
          linear-gradient(rgba(242, 255, 201, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(242, 255, 201, 0.07) 1px, transparent 1px);
        background-size: 56px 56px;
        color: #f2ffc9;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      p {
        margin: 0;
        max-width: 22em;
        color: color-mix(in srgb, #f2ffc9 72%, #23212b);
        font-size: 22px;
        line-height: 1.4;
      }
      .panel {
        padding: 22px;
        border: 1px solid color-mix(in srgb, #f2ffc9 18%, transparent);
        border-radius: 18px;
        background: #f2ffc9;
        color: #23212b;
      }
      .row {
        display: flex;
        justify-content: space-between;
        margin: 0 0 12px;
        padding: 12px 14px;
        border-radius: 12px;
        background: color-mix(in srgb, #f2ffc9 70%, #fff);
        font-size: 18px;
        font-weight: 650;
      }
      .row span:last-child {
        font-variant-numeric: tabular-nums;
      }
      .muted {
        margin: 8px 0 0;
        font-size: 14px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>TF2 Inventory Value</h1>
      <p>keys/ref on Steam inventories and trade offers. Unusuals by effect. No API key.</p>
    </div>
    <div class="panel">
      <div class="row"><span>Backpack</span><span>124.80 keys</span></div>
      <div class="row"><span>Unusual (by effect)</span><span>41.20 keys</span></div>
      <div class="row"><span>Trade difference</span><span>+2.15 keys</span></div>
      <p class="muted">Overlay on steamcommunity.com · unofficial</p>
    </div>
  </body>
</html>

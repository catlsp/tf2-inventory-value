<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>screenshot trade 1280x800</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #1b2838;
        font-family: "Motiva Sans", "Segoe UI", Arial, sans-serif;
      }
      .page {
        box-sizing: border-box;
        width: 1280px;
        height: 800px;
        padding: 28px 48px;
        background: linear-gradient(#1b2838, #15202d);
        color: #c7d5e0;
      }
      h1 {
        margin: 0 0 8px;
        color: #fff;
        font-size: 26px;
        font-weight: 400;
      }
      .sub {
        margin: 0 0 16px;
        color: #8f98a0;
        font-size: 13px;
      }
      #tf2iv-trade-panel {
        margin: 0 0 20px;
        padding: 12px 14px;
        border: 1px solid #6b3a16;
        border-radius: 6px;
        background: #1b1d21;
        color: #f4e6c3;
        font-size: 13px;
      }
      #tf2iv-trade-panel h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: #ff7a2f;
      }
      .tf2iv-trade-rows {
        display: grid;
        gap: 4px;
        margin-top: 8px;
      }
      .is-plus {
        color: #8fdf7a;
        font-weight: 700;
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      h2 {
        margin: 0 0 10px;
        color: #fff;
        font-size: 16px;
        font-weight: 400;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .item {
        position: relative;
        width: 84px;
        height: 84px;
        border: 1px solid #3a4553;
        background: var(--slot, #2a475e);
      }
      .tf2iv-price {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 2px;
        background: rgba(12, 12, 14, 0.86);
        color: #f4e6c3;
        font-size: 10px;
        text-align: center;
      }
      .is-unusual {
        color: #d6a3ff;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Trade offer</h1>
      <p class="sub">Steam Community ▸ overlay on the offer you already opened</p>
      <div id="tf2iv-trade-panel">
        <h3>TF2 Inventory Value</h3>
        <div class="tf2iv-trade-rows">
          <div>You give <strong>12.40 keys</strong></div>
          <div>You receive <strong>14.55 keys</strong></div>
          <div class="is-plus">+2.15 keys</div>
        </div>
      </div>
      <div class="cols">
        <div>
          <h2>Your items</h2>
          <div class="row">
            <div class="item" style="--slot:#6b3a16"><div class="tf2iv-price">1.00 key</div></div>
            <div class="item" style="--slot:#6b3a16"><div class="tf2iv-price">1.00 key</div></div>
            <div class="item" style="--slot:#3d7ea6"><div class="tf2iv-price">8.20 keys</div></div>
            <div class="item" style="--slot:#5a6b4a"><div class="tf2iv-price">2.20 keys</div></div>
          </div>
        </div>
        <div>
          <h2>Their items</h2>
          <div class="row">
            <div class="item" style="--slot:#7a4ac8"><div class="tf2iv-price is-unusual">11.50 keys</div></div>
            <div class="item" style="--slot:#c4a35a"><div class="tf2iv-price">3.05 keys</div></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
